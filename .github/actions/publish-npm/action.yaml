name: Publish to npm
description: Stage a package or filtered workspace packages for npm publication via VitePlus with provenance.

inputs:
  working-directory:
    description: Package directory, or workspace root when filters are provided.
    required: true
  filters:
    description: Optional pnpm workspace selectors, one per line. Enables recursive publication.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Stage npm packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUBLISH_FILTERS: ${{ inputs.filters }}
      run: |
        eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
        filters=()
        while IFS= read -r filter; do
          filter="${filter%$'\r'}"
          [[ -z "$filter" ]] && continue
          filters+=(--filter "$filter")
        done <<< "$PUBLISH_FILTERS"

        if (( ${#filters[@]} > 0 )); then
          vp pm stage publish -r --provenance "${filters[@]}"
        else
          registry=$(node --print "require('./package.json').publishConfig?.registry || 'https://registry.npmjs.org'")
          encoded_name=$(node --print "encodeURIComponent(require('./package.json').name)")
          version=$(node --print "require('./package.json').version")
          status=$(curl -sS -o /dev/null -w "%{http_code}" "${registry%/}/${encoded_name}/${version}")
          case "$status" in
            200) echo "v${version} already published. Skipping." ;;
            404) vp pm stage publish --provenance ;;
            *) echo "Registry lookup failed with HTTP ${status}." >&2; exit 1 ;;
          esac
        fi
