name: Publish to npm
description: Stage a package or filtered workspace packages for npm publication via VitePlus with provenance.

inputs:
  dev-shell:
    description: Nix devShell attribute to load.
    required: false
    default: default
  working-directory:
    description: Package directory, or workspace root when filters are provided.
    required: true
  filters:
    description: Optional pnpm workspace selectors, one per line. Defaults to the current package.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Stage npm packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NIX_DEV_SHELL: ${{ inputs.dev-shell }}
        PUBLISH_FILTERS: ${{ inputs.filters }}
      run: |
        eval "$(nix print-dev-env "$GITHUB_WORKSPACE#$NIX_DEV_SHELL")"
        filters=()
        while IFS= read -r filter; do
          filter="${filter%$'\r'}"
          [[ -z "$filter" ]] && continue
          filters+=(--filter "$filter")
        done <<< "$PUBLISH_FILTERS"

        if (( ${#filters[@]} == 0 )); then
          filters=(--filter .)
        fi
        # Recursive publication also skips published versions for a single package.
        vp pm stage publish -r --provenance "${filters[@]}"
