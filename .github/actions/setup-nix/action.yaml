name: Setup Nix
description: Install Determinate Nix, cache store paths, and prepare the development shell.

inputs:
  cache-url:
    description: HTTPS binary cache URL. Leave all cache inputs empty to disable configuration.
    required: false
    default: ''
  cache-public-key:
    description: Cache signing public key in name:base64 format. Required with cache-url.
    required: false
    default: ''
  cache-username:
    description: Optional HTTP Basic authentication username. Requires cache-password.
    required: false
    default: ''
  cache-password:
    description: Optional HTTP Basic authentication password. Pass a GitHub secret.
    required: false
    default: ''
  prepare-dev-shell:
    description: Prepare the development shell. Disable for jobs that only need Nix itself.
    required: false
    default: 'true'
  dev-shell:
    description: Nix devShell attribute to prepare. Use the same shell in subsequent steps.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7

    - name: Enable Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false
        use-gha-cache: true

    - name: Configure binary cache
      shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
        CACHE_PUBLIC_KEY: ${{ inputs.cache-public-key }}
        CACHE_USERNAME: ${{ inputs.cache-username }}
        CACHE_PASSWORD: ${{ inputs.cache-password }}
      run: |
        set +x
        python3 "$GITHUB_ACTION_PATH/configure-cache.py"

    - name: Prepare Nix development shell
      if: ${{ inputs.prepare-dev-shell == 'true' }}
      shell: bash
      env:
        NIX_DEV_SHELL: ${{ inputs.dev-shell }}
      run: nix develop "$GITHUB_WORKSPACE#$NIX_DEV_SHELL" --command true
