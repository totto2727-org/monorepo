name: Check MoonBit
description: Check the MoonBit workspace after running setup-moonbit.

inputs:
  dev-shell:
    description: Legacy Nix shell for auxiliary tools. New callers must provide those tools separately.
    required: false
    deprecationMessage: Set up auxiliary tools separately and remove this input.

runs:
  using: composite
  steps:
    - name: Check MoonBit workspace
      shell: bash
      env:
        LEGACY_DEV_SHELL: ${{ inputs.dev-shell }}
      run: |
        moon_bin="$(command -v moon)"
        if [[ -n "$LEGACY_DEV_SHELL" ]]; then
          nix_env="$(nix print-dev-env "$GITHUB_WORKSPACE#$LEGACY_DEV_SHELL")"
          eval "$nix_env"
          export PATH="${moon_bin%/*}:$PATH"
        fi
        "$moon_bin" fmt --check
        "$moon_bin" check --deny-warn
        "$moon_bin" build
        "$moon_bin" test
