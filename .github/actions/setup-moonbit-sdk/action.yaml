name: Setup MoonBit SDK
description: Install the stable MoonBit toolchain and update the registry.

runs:
  using: composite
  steps:
    - name: Set up MoonBit
      uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26

    - name: Update MoonBit registry
      shell: bash
      run: moon update
