name: Setup MoonBit
description: Legacy Nix-based setup. New workflows should use setup-moonbit-sdk.

inputs:
  dev-shell:
    description: Nix devShell attribute to load.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Update MoonBit registry
      shell: bash
      env:
        NIX_DEV_SHELL: ${{ inputs.dev-shell }}
      run: |
        eval "$(nix print-dev-env "$GITHUB_WORKSPACE#$NIX_DEV_SHELL")"
        moon update
