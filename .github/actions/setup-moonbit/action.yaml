name: Setup MoonBit
description: Install the stable MoonBit toolchain and update the registry.

inputs:
  dev-shell:
    description: Ignored. Retained for existing callers during migration.
    required: false
    deprecationMessage: MoonBit setup no longer uses a Nix dev shell. Remove this input.

runs:
  using: composite
  steps:
    - name: Set up MoonBit
      uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26

    - name: Update MoonBit registry
      shell: bash
      run: moon update
