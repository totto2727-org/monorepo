name: Build and push Docker image by digest
description: Build a single-platform image, push by digest to a registry, and upload the digest as an artifact for later manifest list assembly.

inputs:
  context:
    required: true
  file:
    required: true
  image:
    required: true
    description: Image repository (without tag), e.g. ghcr.io/owner/repo/name
  platform:
    required: true
  artifact-name:
    required: true
  registry:
    required: true
  registry-username:
    required: true
  registry-password:
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platform }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p /tmp/digests
        touch "/tmp/digests/${DIGEST#sha256:}"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
