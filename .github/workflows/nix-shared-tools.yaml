name: Nix shared tools

on:
  pull_request:
    paths:
      - nix/share/packages/**
      - .github/actions/setup-nix/**
      - .github/actions/setup-typescript/**
      - .github/workflows/nix-shared-tools.yaml
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .npmrc
      - .node-version
      - .nvmrc
      - vite.config.ts
  push:
    branches: [main]
    paths:
      - nix/share/packages/**
      - .github/actions/setup-nix/**
      - .github/actions/setup-typescript/**
      - .github/workflows/nix-shared-tools.yaml
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .npmrc
      - .node-version
      - .nvmrc
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-nix
        with:
          prepare-dev-shell: 'false'

      - name: Check native Nix system
        shell: bash
        env:
          EXPECTED_NIX_SYSTEM: ${{ matrix.system }}
        run: |
          actual_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          printf 'Expected %s, running %s\n' "$EXPECTED_NIX_SYSTEM" "$actual_system"
          [[ "$actual_system" == "$EXPECTED_NIX_SYSTEM" ]]

      - name: Build shared packages and check versions without credentials
        shell: bash
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/nix-shared-tools.XXXXXX")
          trap 'rm -rf "$smoke_root"' EXIT
          for package in pass-cli monid oo-cli; do
            output=$(nix build "./nix/share/packages#$package" --no-link --print-out-paths)
            home="$smoke_root/$package"
            mkdir -p "$home"
            case "$package" in
              pass-cli) binary=pass-cli; arguments=(version) ;;
              monid) binary=monid; arguments=(--version) ;;
              oo-cli) binary=oo; arguments=(version --json) ;;
            esac
            env -i PATH="$PATH" HOME="$home" XDG_CONFIG_HOME="$home/.config" \
              XDG_CACHE_HOME="$home/.cache" XDG_DATA_HOME="$home/.local/share" \
              CI=true NO_COLOR=1 "$output/bin/$binary" "${arguments[@]}"
            if [[ "$package" == oo-cli ]]; then
              env -i PATH="$PATH" HOME="$home" XDG_CONFIG_HOME="$home/.config" \
                XDG_CACHE_HOME="$home/.cache" XDG_DATA_HOME="$home/.local/share" \
                CI=true NO_COLOR=1 "$output/bin/oo" skills info --source bundled --json
            fi
          done

      - name: Set up official Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: false

      - name: Check Vite+ and its Node.js runtime
        shell: bash
        run: |
          vp env install lts
          vp --version
          vp exec node --version
