name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/setup-moonbit

      - uses: ./.github/actions/setup-typescript

      - uses: ./.github/actions/setup-elixir

      - name: Run check, build, and test
        uses: ./.github/actions/measure-command
        with:
          command: |
            eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
            vp run ci

      - name: Upload CI performance metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-performance-${{ github.run_attempt }}
          path: ci-metrics
          if-no-files-found: error
          retention-days: 14
